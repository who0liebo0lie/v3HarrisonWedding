<body>
  <header class="site-header">
    <a href="index.html" class="header-logo">HARRISON <span>Set Sail</span> ⚓</a>
    <button class="nav-toggle" aria-label="Toggle Navigation">☰</button>
    <nav>
      <ul class="nav-menu">

  <main class="container">
    <div class="text-center" style="margin-bottom:2rem;">
      <h1>Will You Set Sail With Us?</h1>
      <p class="script-accent">Please respond by September 15, 2026</p>
    </div>

    <form id="rsvp-form" class="card" style="max-width:800px; margin:0 auto;">
      <div class="form-group">
        <label for="guest-count-select">How many guests are you responding for?</label>
        <select id="guest-count-select" class="form-control">
          <option value="1">1 Guest</option>
          <option value="2">2 Guests</option>
          <option value="3">3 Guests</option>
          <option value="4">4 Guests</option>
        </select>
      </div>

      <div id="dynamic-guests-container"></div>

      <div class="text-center" style="margin-top:2rem;">
        <button type="submit" class="btn-primary">SUBMIT MY RSVP</button>
      </div>
    </form>
  </main>

  <script src="js/navigation.js"></script>
  <script src="js/rsvp.js"></script>

<div class="faq-hotspots" aria-label="Bingo FAQs">
<button class="pb-faq" data-q="When does the game start?" data-a="The game goes live once we set sail! Play anytime during the cruise — matches update in real time on the leaderboard." style="left:4.2%;top:97.3%;width:17.2%;height:1.9%"></button>
<button class="pb-faq" data-q="How do I submit my fact?" data-a="Your fun fact IS your entry — share it in the 'Your Bingo Clue' box when you RSVP. One surprising or funny fact about yourself is all it takes." style="left:22.5%;top:97.3%;width:17.2%;height:1.9%"></button>

<button class="pb-faq" data-q="What if I can't find someone?" data-a="Ask around! Every fact is a conversation starter. Introduce yourself, ask questions, and don't give your own fact away too easily — that's the whole game." style="left:59%;top:97.3%;width:17.2%;height:1.9%"></button>
<button class="pb-faq" data-q="How are points calculated?" data-a="Every correct match earns points, and the more you match, the higher you climb the leaderboard. 100% virtual, no paper — and bragging rights are everything." style="left:77.3%;top:97.3%;width:17.4%;height:1.9%"></button>
